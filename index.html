<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Toolkit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="main_container">

        <h1 id="title1">COLOR TOOLKIT</h1>

        <div class="color_container">
            <h1>
                <p id="color">PINK</p>
            </h1>
            <h3>
                <p id="code">#FFC0CB</p>
            </h3>
            <p id="page">1 of 25</p>
        </div>


        <div class="main_button">

            <button id="btn1">
                <i class="fa-solid fa-angle-left" style="color: rgb(255, 255, 255);"></i>
                PREVIOUS</button>
            <button id="btn2">
                <i class="fa-solid fa-dice-two" style="color: rgb(255, 255, 255);"></i>
                RANDOM
            </button>
            <button id="btn3">
                NEXT
                <i class="fa-solid fa-angle-right" style="color: rgb(255, 255, 255);"></i>
            </button>

        </div>

        <div class="main_button2">
            <button id="btn4">
                <i class="fa-solid fa-rotate" style="color: rgb(255, 255, 255);"></i>
                RESET
            </button>
        </div>

        <h3 id="title2">COLOR INFORMATION</h3>


        <div class="color_info">

            <div class="info">

                <div class="info-title">
                    <p>HEX CODE</p>
                    <button id="copy-hex">
                        <i class="fa-solid fa-copy" style="color: rgb(255, 255, 255);"></i>
                    </button>
                </div>
                <p id="hex-code">#FFC0CB</p>
            </div>

            <div class="info">

                <div class="info-title">
                    <p>RGB VALUE</p>
                    <button id="copy-rgb">
                        <i class="fa-solid fa-copy" style="color: rgb(255, 255, 255);"></i>
                    </button>
                </div>
                <p id="rgb-value">rgb(255, 192, 203)</p>
            </div>

            <div class="info">

                <div class="info-title">
                    <p>HSL Value</p>
                    <button id="copy-hsl">
                        <i class="fa-solid fa-copy" style="color: rgb(255, 255, 255);"></i>
                    </button>
                </div>
                <p id="hsl-value">hsl(351, 100%, 88%)</p>
            </div>

        </div>

        <div class="palette_section">
            <h3>COLOR PALETTE</h3>

            <div class="palette">

                <div class="color-circle"></div>
                <div class="color-circle"></div>
                <div class="color-circle"></div>
                <div class="color-circle"></div>
                <div class="color-circle"></div>
                <div class="color-circle"></div>
                <div class="color-circle"></div>

            </div>


        </div>
    </div>
   <script src="script.js"></script>
</body>

</html>
